server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Головне правило для SPA: якщо файл не знайдено, віддаємо index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кешування статичних ресурсів (JS, CSS, картинки)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}